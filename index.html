<style>
:root{--bg:#14102a;--fg:#f6eefc;--pk:#ff8fb1;--bl:#8fb6ff;--red:#ff8fb1;--moon:#f6eefc;--mist:#b9b0d0;--lamp:#ff8fb1;--frost:#8fb6ff;--ln:#ffffff44;
 --serif:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;--pix:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;color-scheme:dark}
html,body{height:100%}

#bgi,#cg{position:absolute;left:0;right:0;top:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 210px);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(#000 80%,#0000);mask-image:linear-gradient(#000 80%,#0000);transition:opacity .4s}

#bg::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:linear-gradient(#14102a66 0,#14102a00 16%,#14102a00 52%,#14102a99 74%,#14102a 100%)}
.dorm,.fruit,.kneel,.kitchen,.alone,.phone,.bed,.hood,.jelly,.morn,.prac,.ter{background:linear-gradient(#3b2f4f,#1c1730)}

#ph{position:absolute;left:0;right:0;top:64px;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 250px);display:none;align-items:center;justify-content:center;z-index:1}

#phd.hide{display:none}

#phe{position:absolute;left:50%;top:76%;width:18cqw;height:18cqw;margin-left:-9cqw;border-radius:50%;background:#ff6b8f;display:grid;place-items:center;transition:opacity .3s}
#phe i{width:8cqw;height:3cqw;border-radius:3cqw 3cqw 1cqw 1cqw;background:#fff}

#ph.off #pht{display:block}

/* chat */
#chat{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 58px);bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 250px);display:none;flex-direction:column;background:#120d28e6;border:1px solid #fff4;border-radius:16px;z-index:1;box-shadow:0 14px 40px #0008}
#chat.on{display:flex}
#chat header{padding:11px 16px;border-bottom:1px solid #fff2;font-size:15px;text-align:center}
#cl{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}

#cl .H{position:relative;align-self:flex-end;background:var(--pk);color:#2a1030;border-bottom-right-radius:5px}

#cl .H+.Y,#cl .Y+.H{margin-top:8px}

#cl .tyb i{width:6px;height:6px;border-radius:50%;background:#d6cce8;animation:tyd 1s ease-in-out infinite}
#cl .tyb i:nth-child(2){animation-delay:.15s}#cl .tyb i:nth-child(3){animation-delay:.3s}
@keyframes tyd{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}

#box.tin,#box.tin small{visibility:hidden!important}
#tap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 90px);text-align:center;font-size:13px;color:var(--mist);display:none;z-index:3;pointer-events:none;animation:bl 1.6s steps(2) infinite}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:2}

.hide{display:none!important}

button:focus-visible{outline:3px solid var(--pk)}

.cv{margin-bottom:28px}

.mw{width:100%;display:flex;flex-direction:column;align-items:center}

/* game chrome */
#bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:8px;right:8px;display:flex;justify-content:flex-end;gap:3px;z-index:5}

#bk{margin-right:auto}
#chap{display:none}
#nm{align-self:flex-start;margin:0 0 -10px 12px;position:relative;z-index:3;box-shadow:0 2px 8px #0004;background:var(--pk);color:#2a1030;border-radius:999px;padding:2px 14px;font-size:15px}
#nm.nY{background:var(--bl);color:#10203a}
#nm.nM{background:#ffd6e4;color:#2a1030}
#nm.nG{background:#b6e88f;color:#1c2e10}
#box{position:relative;min-height:158px;max-height:230px;overflow-y:auto;padding:20px 18px 30px;font-size:17px;line-height:1.8;word-break:keep-all;cursor:pointer;color:#2a2140;background:#fbf8ffee;border:1px solid #fff;border-radius:14px;scrollbar-width:none;box-shadow:0 8px 28px #0007}

#box.nar{color:#3a3150}

#ch{display:flex;flex-direction:column;gap:11px;margin-bottom:12px;position:relative;z-index:6}

#ch button:hover,#ch button:focus-visible{background:#eef3ff;transform:translateX(3px);outline:0}

#ov{background:#0a0618f2;justify-content:flex-start;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 30px;z-index:8}

.lg{padding:7px 0;border-bottom:1px solid #fff2;font-size:15px;line-height:1.6}.lg b{color:var(--pk);margin-right:6px}
.gl{background:#ffffff12;border-radius:10px;padding:10px 12px;margin-bottom:10px;line-height:1.7;font-size:14px}.gl small{color:var(--pk)}
#ov input{font-family:var(--pix);font-size:18px;text-align:center;width:min(260px,80%);margin:6px auto 18px;display:block;padding:10px;background:#ffffff14;color:var(--fg);border:1.5px solid #ffffff55;border-radius:12px}
#ov input:focus{outline:3px solid var(--pk)}
.dj{display:block;width:100%;text-align:left;font-family:var(--pix);background:#ffffff10;color:var(--fg);border:1px solid #fff3;border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer;line-height:1.5;font-size:14px}
.dj:hover{border-color:var(--pk)}.dj b{color:var(--pk);margin-right:6px;font-weight:400}.dj small{display:block;color:var(--mist);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--pk);color:#2a1030;padding:6px 16px;border-radius:999px;font-size:14px;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#menu .cv{order:2;margin-bottom:26px}#menu .cv-n{order:1;position:static;margin:0 0 10px;font-size:13px;opacity:1;color:#fff;background:#ffffff1f;border:1px solid #ffffff55;border-radius:999px;padding:4px 14px;letter-spacing:.06em;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}#menu .mw{order:3}
#bg:has(#cg.on) #bgi{opacity:0}
#blang{border-style:solid;margin-top:14px}
</style>

<script>
window.TR=window.TR||{};window.TR.en={
"\uc0c8\ubcbd \ud55c \uc2dc\uac00 \uac00\uae4c\uc6b4 \uc219\uc18c \uac70\uc2e4. \uc5f0\uc2b5\uc744 \ub9c8\uce5c \uc6b0\ub9ac\ub294 \uc18c\ud30c\uc5d0 \ub298\uc5b4\uc838 \uc788\ub2e4. \ub098\ub294 \uc720\uc9c4\uc774 \uc190\uc5d0 \ub4e0 \uacfc\uc790 \ubd09\uc9c0\ub9cc \ub178\ub824\ubcf8\ub2e4.":"Nearly 1 a.m., the dorm living room. Done with practice, we're sprawled across the sofa. I'm glaring at the bag of snacks in Yujin's hand.",
"\uc720\uc9c4\uc544, \ud55c \uc785\ub9cc. \uc544~":"Yujin, just one bite. Ahh~",
"\uc785\uc744 \ubc8c\ub9b0 \ucc44 \ub208\ub9cc \ub3d9\uadf8\ub797\uac8c \ub728\uace0 \uc62c\ub824\ub2e4\ubcf8\ub2e4. \uacfc\uc790\ub97c \uc9d1\ub358 \uc720\uc9c4\uc758 \uc190\uc774 \uba48\ucd98\ub2e4.":"Mouth open, I look up at him with wide, round eyes. Yujin's hand freezes halfway into the bag.",
"\ud615, \uadf8\ub807\uac8c \uadc0\uc5fd\uac8c \uccd0\ub2e4\ubd10\ub3c4 \uc548 \ub3fc\uc694.":"Hyung, looking at me that cutely won't work.",
"\uc720\uc9c4\uc774 \uc791\uac8c \ud55c\uc228\uc744 \uc270\ub2e4. \uba39\uace0 \uc788\ub358 \uacfc\uc790\ub97c \ub2e4\uc815\ud558\uac8c \uc9d1\uc5b4 \ub0b4 \uc785\uc5d0 \ub123\uc5b4 \uc900\ub2e4. \uc190\ub05d\uc774 \uc785\uc220 \uac00\uc7a5\uc790\ub9ac\ub97c \uc2a4\uce58\uace0 \uc9c0\ub098\uac04\ub2e4.":"Yujin lets out a small sigh. He picks up a snack and gently puts it in my mouth. His fingertip brushes the corner of my lips.",
"\u2026\ub9d0\ud2f0\uc988\ucc98\ub7fc \uba39\ub124.":"\u2026You eat like a Maltese.",
"\uc791\uac8c \uc911\uc5bc\uac70\ub9ac\uace0\ub294 \uc720\uc9c4\uc774 \uc785\uaf2c\ub9ac\ub97c \uc2ac\uca4d \uc62c\ub9b0\ub2e4. \ub180\ub9ac\ub294 \ub9d0\uc778\ub370 \ubaa9\uc18c\ub9ac\uac00 \uc774\uc0c1\ud558\uac8c \ub2e4\uc815\ud558\ub2e4.":"Yujin mutters it under his breath, the corner of his mouth tugging up. It's teasing, but his voice is strangely tender.",
"\ub9d0\ud2f0\uc988? \ub098 \uc9c0\uae08 \uac15\uc544\uc9c0 \ucde8\uae09\ub2f9\ud55c \uac70\uc57c?":"A Maltese? Are you treating me like a puppy right now?",
"\uadf8\ub798\ub3c4 \uae68\ubb34\ub294 \uac74 \uc548 \ub3fc\uc694.":"Still, no biting.",
"\ub9d0\ub05d\uc5d0 \uc720\uc9c4\uc774 \uc7a5\ub09c\uc2a4\ub7fd\uac8c \uc6c3\ub294\ub2e4. \uadf8 \uc5bc\uad74\uc744 \ubcf4\uace0 \uc788\uc790\ub2c8 \ub098\ub3c4 \ubaa8\ub974\uac8c \ub530\ub77c \uc6c3\uac8c \ub41c\ub2e4.":"Yujin grins playfully at the end. Looking at that face, I end up smiling along without meaning to.",
"\uc774\ub7f0 \uc0ac\uc18c\ud55c \uac8c \uc88b\uc544\uc11c \ub9e4\uc77c \ubaa8\ub978 \ucc99 \uc7a5\ub09c\uc744 \uce5c\ub2e4. \uc88b\uc544\ud55c\ub2e4\ub294 \ub9d0\uc740 \uc7a5\ub09c\uc5d0\ub3c4 \ubabb \uc11e\uc73c\uba74\uc11c.":"I love these little moments, so every day I play dumb and tease him. Even though I can't slip the word \"like\" into a single joke.",
"\uc720\uc9c4\uc758 \uc5b4\uae68\uc5d0 \uae30\ub304\ub2e4":"Lean on Yujin's shoulder",
"\u2026\ubb34\uac70\uc6cc\uc694, \ud615.":"\u2026You're heavy, hyung.",
"\uadf8\ub7ec\uba74\uc11c\ub3c4 \ub0b4\uac00 \ud3b8\ud558\ub3c4\ub85d \uc5b4\uae68\ub97c \uc0b4\uc9dd \ub0ae\ucdb0 \uc900\ub2e4. \uadc0\ub05d\uc774 \uc870\uae08 \ube68\uac1b\ub2e4.":"Even so, he lowers his shoulder a little so I'm comfortable. The tips of his ears are slightly red.",
"\u201c\ud558\ub098 \ub354~\u201d \ub2e4\uc2dc \uc544~ \ud558\uace0 \uc785\uc744 \ubc8c\ub9b0\ub2e4":"\"One more~\" Open wide again, ahh~",
"\u2026\ud558\ub098\ub9cc\uc774\uc5d0\uc694. \uc9c4\uc9dc\ub85c.":"\u2026Just one. I mean it.",
"\uadf8\ub7ec\uba74\uc11c \ub610 \ud558\ub098\ub97c \uc9d1\uc5b4 \ub0b4 \uc785\uc5d0 \ub123\uc5b4 \uc900\ub2e4. \uc785\uc744 \ub2e4\ubb38 \ucc44 \uc6b0\ubb3c\uac70\ub9ac\ub294 \ub098\ub97c \ubcf4\uace0 \uc720\uc9c4\uc774 \uc791\uac8c \uc6c3\ub294\ub2e4.":"Then he picks up another and puts it in my mouth. Watching me chew with my mouth shut, Yujin laughs softly.",
"\uc720\uc9c4\uc774\uac00 \uc8fc\ub2c8\uae4c \ub354 \ub9db\uc788\ub2e4~":"It tastes better when Yujin feeds me~",
"\uc720\uc9c4\uc740 \ub300\uafb8 \uc5c6\uc774 \uc0c8 \ubd09\uc9c0\ub97c \ub72f\uc5b4 \ub0b4 \uc55e\uc5d0 \ub193\ub294\ub2e4. \ud22c\ub35c\ub300\ub294 \ub9d0\uacfc \ud589\ub3d9\uc774 \ubc18\ub300\ub2e4.":"Without a word, Yujin tears open a new bag and sets it in front of me. His grumbling and his actions don't match at all.",

"\u2026\uac11\uc790\uae30 \uc65c \uadf8\ub798\uc694.":"\u2026Why all of a sudden?",

"\uc5b4\uae68\ub97c \uac10\uc2fc \uc637\uc790\ub77d \uc0ac\uc774\ub85c \ud76c\ubbf8\ud55c \uc628\uae30\uac00 \uc2a4\uba70\ub4e4\uc5c8\ub2e4. \uc774\uc0c1\ud558\uac8c\ub3c4 \ub9c8\uc74c\uae4c\uc9c0 \ub530\ub73b\ud574\uc9c0\ub294 \uae30\ubd84\uc774\uc5c8\ub2e4.":"A faint warmth seeps in through the fabric wrapped around my shoulders. Strangely, it feels like it's warming my heart too.",
"\uc800 \uc774\ub7f0 \uac70 \ud615\ud55c\ud14c\ub9cc \ud574\uc694.":"I only do this kind of thing for you, hyung.",
"\ub73b\ubc16\uc758 \ub9d0\uc5d0 \uc544\ubb34\ub7f0 \ub300\ub2f5\ub3c4 \ud558\uc9c0 \ubabb\ud588\ub2e4. \uadf8\uc800 \uc720\uc9c4\uc758 \uc5bc\uad74\ub9cc \uba4d\ud558\ub2c8 \ubc14\ub77c\ubcf4\uc558\ub2e4.":"I can't say anything to the unexpected words. I just stare blankly at Yujin's face.",
"\uc81c\uac00 \ub098\uc911\uc5d0 \ub2e4 \uc598\uae30\ud574 \uc900\ub2e4\uace0 \ud588\ub358 \uac70, \uae30\uc5b5\ud574\uc694?":"Remember when I said I'd tell you everything later?",
"\uae30\uc5b5\ub09c\ub2e4. \uc5c9\uc5c9 \uc6b8\ub358 \ubaa8\uc2b5\uc744 \uc720\uc9c4\uc5d0\uac8c \ub4e4\ucf1c \ubc84\ub9b0 \uadf8\ub0a0.":"I remember. The day Yujin caught me sobbing my heart out.",
"\ubd80\ub044\ub7ec\uc6b4 \uae30\uc5b5\uc774 \uc120\uba85\ud558\uac8c \ub5a0\uc62c\ub77c, \ub9d0\uc5c6\uc774 \uace0\uac1c\ub9cc \ub044\ub355\uc600\ub2e4.":"The embarrassing memory comes back vividly, and I just nod without a word.",
"\uadf8\ub0a0, \ubbfc\uc900 \ud615\ud55c\ud14c \uace0\ubbfc \uc0c1\ub2f4\ud558\ub7ec \uac14\ub358 \uac70\uc608\uc694.":"That day, I went to {M} hyung for advice.",
"\ub610\ub2e4\uc2dc \ubbfc\uc900\uc758 \uc774\ub984\uc774\uc5c8\ub2e4. \uadf8 \uc774\ub984\uc744 \ub4e3\ub294 \uc21c\uac04, \ub9c8\uc74c \ud55c\uad6c\uc11d\uc5d0 \uc791\uc740 \uc815\uc804\uae30\uac00 \uc774\ub294 \ub4ef\ud588\ub2e4.":"{M}'s name again. The moment I hear it, it feels like a tiny spark of static crackles in a corner of my heart.",
"\ud615\uc744 \uc88b\uc544\ud558\ub294\ub370 \uc5b4\ub5bb\uac8c \ud574\uc57c \ub420\uc9c0 \ubaa8\ub974\uaca0\uc5b4\uc11c.":"Because I like a hyung and I didn't know what to do.",
"\uc0dd\uac01\uc9c0\ub3c4 \ubabb\ud55c \ub9d0\uc5d0 \uace0\uac1c\ub97c \ubc88\uca4d \ub4e4\uc5c8\ub2e4. \uc720\uc9c4\uc740 \uc7a0\uc2dc \ub098\uc640 \ub208\uc744 \ub9de\ucd94\ub354\ub2c8, \uc774\ub0b4 \uc2dc\uc120\uc744 \uc544\ub798\ub85c \ub5a8\uad6c\uc5c8\ub2e4.":"At the unexpected words, my head snaps up. Yujin meets my eyes for a moment, then drops his gaze.",
"\u2026\uc5b4\ub5a4 \ud615?":"\u2026Which hyung?",
"\uc720\uc9c4\uc774 \ub2f9\ud669\ud55c \ub4ef \uadc0\ub05d\uae4c\uc9c0 \ube68\uac1c\uc9c0\ub354\ub2c8, \ub9d0\uc5c6\uc774 \uc190\uac00\ub77d\uc73c\ub85c \ub098\ub97c \uac00\ub9ac\ucf30\ub2e4.":"Yujin turns red all the way to the tips of his ears, flustered, and silently points at me.",
"\u201c\u2026\uc720\uc9c4\uc544, \ub108 \ub098 \uc88b\uc544\ud574?\u201d":"\"\u2026Yujin, do you like me?\"",
"\u2026\uc720\uc9c4\uc544, \ub108 \ub098 \uc88b\uc544\ud574?":"\u2026Yujin, do you like me?",
"\uc720\uc9c4\uc774 \ub208\uc744 \ud53c\ud558\uc9c0 \uc54a\uace0 \uace0\uac1c\ub97c \ub044\ub355\uc778\ub2e4.":"Yujin nods without looking away.",
"\ub124. \uc88b\uc544\ud574\uc694, \ud615.":"Yes. I like you, hyung.",
"\u2026\ub098\ub9cc \uadf8\ub7f0 \uac8c \uc544\ub2c8\uc5c8\uad6c\ub098.":"\u2026So it wasn't just me.",
"\u201c\ub098\ub3c4 \uc720\uc9c4\uc774 \uc88b\uc544\ud558\uc9c0\u2026\u201d":"\"Of course I like you too, Yujin\u2026\"",
"\ub098\ub3c4 \uc720\uc9c4\uc774 \uc88b\uc544\ud558\uc9c0\u2026":"Of course I like you too, Yujin\u2026",
"\uc720\uc9c4\uc774 \ud55c \uac78\uc74c \ub2e4\uac00\uc640 \ub0b4 \uc5b4\uae68\ub97c \uc7a1\uc73c\uba70 \ub9d0\ud588\ub2e4.":"Yujin steps closer and takes hold of my shoulders as he speaks.",
"\ud615\uc774 \ub098\ud55c\ud14c\ub9cc \uc798\ud574 \uc92c\uc73c\uba74 \uc88b\uaca0\uace0, \ub098\ud55c\ud14c\ub9cc \uc6c3\uc5b4 \uc92c\uc73c\uba74 \uc88b\uaca0\uace0, \ud615\uc774 \uc81c\uc77c \uba3c\uc800 \ucc3e\ub294 \uc0ac\ub78c\ub3c4 \ub098\uc600\uc73c\uba74 \uc88b\uaca0\uc5b4\uc694.":"I want you to be good only to me, smile only at me, and I want to be the first person you look for.",
"\ubb50\ub77c\uace0 \ub9d0\ud574\uc57c \ud560\uc9c0 \ubab0\ub77c \uc544\ubb34 \ub9d0\ub3c4 \ud558\uc9c0 \ubabb\ud588\ub2e4.":"I don't know what to say, so I say nothing at all.",
"\ub300\ub2f5\uc744 \ubabb \ud558\uace0 \uc2dc\uc120\uc744 \ud53c\ud55c\ub2e4":"Look away without answering",
"\ub3c4\ub9dd\uac00\ub3c4 \ub418\ub294\ub370, \uc624\ub298\uc740 \uadf8\ub0e5 \ub4e3\uace0 \uc788\uc5b4\uc694.":"You can run away, but just listen today.",
"\uc720\uc9c4\uc758 \ubaa9\uc18c\ub9ac\uac00 \ub0ae\ub2e4. \ub3c4\ub9dd\uce60 \uacf3\uc740 \uc0ac\uc2e4 \uc5c6\ub2e4.":"Yujin's voice is low. There's nowhere to run anyway.",
"\ub098 \ub9d0\uace0 \ub2e4\ub978 \uc0ac\ub78c\uc774\ub791 \ub354 \uce5c\ud574\uc9c0\ub294 \uac83\ub3c4 \uc2eb\uace0, \ud615\uc774 \ub2e4\ub978 \uc0ac\ub78c\ud55c\ud14c \ub098\ud55c\ud14c \ud558\ub4ef\uc774 \ub2e4\uc815\ud558\uac8c \uad6c\ub294 \uac83\ub3c4 \uc2eb\uc5b4\uc694.":"I don't want you getting closer to anyone but me, and I don't want you being sweet to anyone else the way you are with me.",
"\ub2f9\ud669\uc2a4\ub7ec\uc6b4 \ub9c8\uc74c\uc744 \ucd94\uc2a4\ub97c \uc0c8\ub3c4 \uc5c6\uc774 \uc720\uc9c4\uc758 \ub9d0\uc774 \uc774\uc5b4\uc84c\ub2e4.":"Before I can pull myself together, Yujin's words keep coming.",
"\uadf8\ub0e5 \ud615\uc774 \ub098\ub9cc \ubd24\uc73c\uba74 \uc88b\uaca0\uc5b4\uc694. \ub098\ub9cc \uc0dd\uac01\ud558\uace0, \ub098\ub9cc \ubcf4\uace0 \uc2f6\uc5b4 \ud558\uace0, \ud798\ub4e4 \ub54c\ub3c4 \ub098\ud55c\ud14c\ub9cc \uae30\ub300\uace0\u2026\u2026":"I just want you to look only at me. Think only of me, miss only me, lean only on me when things are hard\u2026\u2026",
"\ud55c\ub9c8\ub514\ub3c4 \ubcf4\ud0dc\uc9c0 \ubabb\ud55c \ucc44 \uadf8\uc800 \uc720\uc9c4\uc744 \ubc14\ub77c\ubcf4\uc558\ub2e4. \uadd3\uac00\uc5d0 \uc5f4\uc774 \uc624\ub974\ub294 \uac83\uc774 \ub290\uaef4\uc84c\ub2e4.":"Without adding a single word, I just look at Yujin. I can feel the heat rising to my ears.",
"\u2026\u2026\ud615\ub3c4 \uadf8\ub798\uc694?":"\u2026\u2026Do you feel the same, hyung?",
"\uc274 \uc0c8 \uc5c6\uc774 \uc774\uc5b4\uc9c0\ub358 \uace0\ubc31\uc774 \uba4e\uc5c8\ub2e4. \ub300\ub2f5\uc744 \uae30\ub2e4\ub9ac\ub294 \uc720\uc9c4\uc758 \ub208\ube5b\uc5d0\ub294 \uac04\uc808\ud568\uc774 \uac00\ub4dd \ub2f4\uaca8 \uc788\uc5c8\ub2e4.":"The confession that had been pouring out stops. Yujin's eyes, waiting for my answer, are full of longing.",
"\u201c\ub098\ub3c4 \uc720\uc9c4\uc774\ub791 \uac19\uc740 \ub9c8\uc74c\uc778 \uac83 \uac19\uc544.\u201d":"\"I think I feel the same way as you, Yujin.\"",
"\ub098\ub3c4 \uc720\uc9c4\uc774\ub791 \uac19\uc740 \ub9c8\uc74c\uc778 \uac83 \uac19\uc544.":"I think I feel the same way as you, Yujin.",
"\uad1c\ud55c \ubd80\ub044\ub7ec\uc6c0\uc5d0 \uc560\uc368 \uac10\ucdb0 \uc654\ub358 \ub9c8\uc74c\uc744 \uc870\uc2ec\uc2a4\ub808 \ub0b4\uc5b4 \ubcf4\uc600\ub2e4. \uc785 \ubc16\uc73c\ub85c \uaebc\ub0b4\uace0 \ub098\ub2c8, \uadf8\ub3d9\uc548 \ub9c8\uc74c \ud55c\ud3b8\uc5d0 \uc313\uc5ec \uc788\ub358 \uc11c\uc6b4\ud568\ub9c8\uc800 \uc0ac\ub974\ub974 \ub179\uc544\ub0b4\ub9ac\ub294 \ub4ef\ud588\ub2e4.":"I carefully reveal the feelings I'd hidden out of needless embarrassment. Once they're out, even the hurt piled up in a corner of my heart seems to melt away.",
"\uc0ac\ub791\ud55c\ub2e4\uace0 \ub9d0\ud574 \uc8fc\uc138\uc694.":"Please tell me you love me.",
"\uc0ac\ub791\uc744 \uac08\uad6c\ud558\ub294 \uc695\uc2ec\uc2a4\ub7ec\uc6b4 \ub9d0\uc5d0 \uc870\uae08 \ub180\ub77c \uc720\uc9c4\uc744 \ubc14\ub77c\ubcf4\uc558\ub2e4. \uac00\uc2b4 \ud55c\ud3b8\uc774 \ub728\uac70\uc6cc\uc9c0\ub294 \ub4ef\ud588\ub2e4. \uadf8\ud1a0\ub85d \uac04\uc808\ud558\uac8c \ub0b4 \uc0ac\ub791\uc744 \ubc14\ub77c\ub294 \ubaa8\uc2b5\uc774 \uc5b4\uca50\uc9c0 \uc560\ud2cb\ud558\uace0 \uc0ac\ub791\uc2a4\ub7ec\uc6e0\ub2e4.":"A little startled by the greedy plea for love, I look at Yujin. My chest burns. The way he longs so desperately for my love is somehow heartbreaking and lovely.",
"\uc0ac\ub791\ud574\ub77c\uace0 \ud574 \uc918.":"Say \"I love you.\"",
"\ub9c8\uce58 \uc5b4\ub9b0\uc544\uc774\ucc98\ub7fc \ub5bc\ub97c \uc4f0\ub4ef, \ubc18\ub9d0\ub85c \ub2e4\uc2dc \ud55c\ubc88 \uc0ac\ub791\uc744 \uc694\uad6c\ud588\ub2e4.":"Like a child throwing a tantrum, he demands love once more, this time dropping the formalities.",
"\uc0ac\ub791\ud574.":"I love you.",
"\uc0ac\ub791\uc744 \ubcf4\ucc44\ub294 \uc720\uc9c4\uc744 \ubc14\ub77c\ubcf4\uba70 \ub2e4\uc815\ud558\uac8c \ub9d0\ud588\ub2e4. \uadf8 \uc9e7\uc740 \ud55c\ub9c8\ub514\uc5d0 \ub2f4\uae34 \ub9c8\uc74c\ub9cc\ud07c\uc740 \uc870\uae08\ub3c4 \uac00\ubccd\uc9c0 \uc54a\uc558\ub2e4.":"I say it tenderly, looking at Yujin begging for love. Short as it is, the feeling in those words is anything but light.",
"\u201c\u2026\u2026\uac81\uc774 \ub098.\u201d":"\"\u2026\u2026I'm scared.\"",
"\u2026\u2026\uac81\uc774 \ub098.":"\u2026\u2026I'm scared.",
"\uadf8\ud1a0\ub85d \ub4e3\uace0 \uc2f6\uc5c8\ub358 \ub9d0\uc774\uc5c8\ub2e4. \uadf8\ub7ec\ub098 \ubc85\ucc2c \uae30\uc068\uc774 \uc790\ub9ac\ud574\uc57c \ud560 \uacf3\uc5d0 \uc5b4\ub461\uace0 \uc9d9\uc740 \uc548\uac1c\uac00 \ub0b4\ub824\uc549\uc558\ub2e4.":"Those were the words I'd longed to hear. But where overwhelming joy should be, a thick, dark fog settles in.",
"\ub354 \uac00\uae4c\uc6cc\uc9c4\ub2e4\ub294 \uac74, \uc5b8\uc820\uac00 \uc9c0\uae08\ubcf4\ub2e4 \ub354 \uba40\uc5b4\uc9c8 \uc218\ub3c4 \uc788\ub2e4\ub294 \ub73b\uc774\ub2c8\uae4c.":"Because getting closer means that someday we could end up even farther apart than now.",
"\ud568\uaed8\ud55c \ucd94\uc5b5\ub3c4, \ub2f9\uc5f0\ud558\uac8c \ub098\ub204\uc5c8\ub358 \uc77c\uc0c1\ub3c4, \ubb34\uc2ec\ud788 \uac74\ub124\ub358 \uc0ac\uc18c\ud55c \uc190\uae38\ub9c8\uc800\ub3c4 \uc5b8\uc820\uac00\ub294 \uc804\ubd80 \uc783\uac8c \ub418\uba74 \uc5b4\ub5a1\ud558\uc9c0.":"What if someday I lose it all? The memories we made, the everyday life we shared so naturally, even the little touches we gave without thinking.",
"\uc800\ub294 \uac81 \ud558\ub098\ub3c4 \uc548 \ub098\uc694.":"I'm not scared at all.",
"\uc870\uae08\uc758 \ub9dd\uc124\uc784\ub3c4 \uc5c6\ub294 \ubaa9\uc18c\ub9ac. \uadf8 \uc18d\uc5d0 \uc605\uc740 \uc18c\ub098\uae30\uac00 \ub0b4\ub9b0\ub2e4.":"A voice without the slightest hesitation. Inside it, a light rain is falling.",
"\uc804\ubd80 \ub2e4 \ub108\ubb34 \ud5f7\uac08\ub824. \ubb50\uac00 \ub9de\ub294\uc9c0 \ubaa8\ub974\uaca0\uc5b4\u2026\u2026":"Everything's so confusing. I don't know what's right\u2026\u2026",
"\uc774 \ub9c8\uc74c\uc73c\ub85c \uc800 \uc0ac\ub791\uc744 \uc9c0\ucf1c\ub0bc \uc790\uc2e0\uc774 \uc5c6\uc5c8\ub2e4.":"I wasn't sure I could protect that love with a heart like mine.",
"\uc7a0\uc2dc \ub098\ub97c \uc751\uc2dc\ud558\ub358 \uc720\uc9c4\uc774 \uc774\ub0b4 \ubab0\uc544\uc138\uc6b0\ub4ef \ubb3c\uc5c8\ub2e4.":"Yujin stares at me for a moment, then presses me.",
"\ud615\uc740 \ub0b4\uac00 \ub2e4\ub978 \uc0ac\ub78c \uc88b\uc544\ud574\ub3c4 \uad1c\ucc2e\uc544\uc694? \ub2e4\ub978 \uc0ac\ub78c\uc774\ub791 \ub9cc\ub098\uace0, \uadf8 \uc0ac\ub78c\ud55c\ud14c \uc0ac\ub791\ud55c\ub2e4\uace0 \ud574\ub3c4?":"Would you be okay if I liked someone else, hyung? If I dated someone else and told them I love them?",
"\uc2eb\ub2e4. \uc0c1\uc0c1\ud558\ub294 \uac83\ub9cc\uc73c\ub85c\ub3c4 \uac00\uc2b4\uc774 \uc800\ub9bf\ud574\uc9c8 \ub9cc\ud07c \uc2eb\ub2e4.":"No. Just imagining it makes my chest ache. I hate it.",
"\ud558\uc9c0\ub9cc \uc0ac\ub791\ud588\ub358 \uae30\uc5b5\ub9c8\uc800 \uc544\ud514\uc73c\ub85c \ub0a8\uac8c \ub418\uba74, \uadf8\ub54c\ub294 \uc5b4\ub5a1\ud558\uc9c0.":"But if even the memories of loving him turn into pain, what then?",
"\uc5b4\ub290 \ucabd\ub3c4 \uacac\ub51c \uc790\uc2e0\uc774 \uc5c6\ub2e4.":"I don't think I could bear either one.",
"\ub2e4\ub978 \uc0ac\ub78c\uc744 \uc0ac\ub791\ud558\ub294 \uc720\uc9c4\uc744 \ubc14\ub77c\ubcf4\ub294 \uac83\ub3c4, \uc0ac\ub791\ud588\ub358 \uc720\uc9c4\uc744 \uc783\ub294 \uac83\ub3c4.":"Watching Yujin love someone else, or losing the Yujin I once loved.",
"\u2026\u2026\ubbf8\uc548\ud574.":"\u2026\u2026I'm sorry.",
"\ub5a8\ub9ac\ub294 \uc228\uacfc \ud568\uaed8 \ub0b4\ubc49\uc740 \ub300\ub2f5\uc5d0 \uc720\uc9c4\uc740 \ud5c8\ud0c8\ud55c \ub4ef \ucc9c\ucc9c\ud788 \uace0\uac1c\ub97c \ub5a8\uad6c\uc5c8\ub2e4.":"At the answer I let out with a trembling breath, Yujin slowly hangs his head, deflated.",
"\ubb34\uc5b8\uac00 \ub9d0\ud558\ub824\ub294 \ub4ef\ud558\ub2e4 \uc774\ub0b4 \uc785\uc744 \ub2e4\ubb3c\uc5c8\ub2e4.":"He seems about to say something, then closes his mouth.",
"\u2026\u2026\ubb34\uc2a8 \ub9d0\uc778\uc9c0 \uc54c\uaca0\uc5b4\uc694.":"\u2026\u2026I understand what you mean.",
"\ub208\ubb3c\uc774 \ud130\uc838 \ubc84\ub9b4 \uac83\ub9cc \uac19\uc558\ub2e4.":"I feel like I might burst into tears.",
"\ucd94\uc6cc\uc694. \uc5bc\ub978 \ub4e4\uc5b4\uac00\uc11c \uc26c\uc5b4\uc694. \uadf8\ub7ec\ub2e4 \uac10\uae30 \uac78\ub824.":"It's cold. Go inside and rest. You'll catch a cold.",
"\uc774 \uc21c\uac04\uc5d0\ub3c4 \uc5ec\uc804\ud788 \ub0b4\uac8c \uc0ac\ub791\uc744 \uac74\ub128\ub2e4.":"Even in this moment, he's still giving me love.",
"\uc815\ub9d0 \ubc14\ubcf4 \uac19\ub2e4.":"I'm such an idiot.",
"\uc720\uc9c4\uc740 \ubb34\uc2a8 \ub9d0\uc744 \ud558\ub824 \ud588\uc744\uae4c.":"What was Yujin about to say?",
"\ubc8c\uc368\ubd80\ud130 \ud6c4\ud68c\uac00 \ubc00\ub824\uc628\ub2e4.":"The regret is already washing over me.",
"\u201c\uadf8\uac78 \uaf2d \ub9d0\ub85c \ub4e4\uc5b4\uc57c \uc54c\uc544?\u201d":"\"Do you really need to hear it out loud?\"",
"\uadf8\uac78 \uaf2d \ub9d0\ub85c \ub4e4\uc5b4\uc57c \uc54c\uc544?":"Do you really need to hear it out loud?",
"\uc720\uc9c4\uc740 \ub300\ub2f5 \ub300\uc2e0 \uc785\uc220\uc744 \uafb9 \uae68\ubb3c\uc5c8\ub2e4. \uc544\ubb34\ub798\ub3c4 \ub0b4 \ub9c8\uc74c\uc744 \uc9c1\uc811 \ud655\uc778\ubc1b\uace0 \uc2f6\uc740 \ubaa8\uc591\uc774\ub2e4.":"Instead of answering, Yujin bites his lip hard. It seems he wants to hear my feelings confirmed directly.",
"\uadf8\ub7fc \ud558\ub098\uc529 \ucc9c\ucc9c\ud788 \ud558\uc790. \ubc25\ub3c4 \uba39\uace0, \ub370\uc774\ud2b8\ub3c4 \ud558\uace0, \ubd80\ubaa8\ub2d8\ub3c4 \ub9cc\ub098\uace0~":"Then let's take it slow, one thing at a time. Have meals together, go on dates, meet the parents~",
"\uc774\ubbf8 \ub2e4 \ud588\uc796\uc544\uc694\u2026\u2026":"We've already done all that\u2026\u2026",
"\ubabb\ub9c8\ub545\ud55c \ub4ef \uc911\uc5bc\uac70\ub9ac\ub294 \uc720\uc9c4\uc758 \ubaa8\uc2b5\uc5d0 \uc2ac\uba70\uc2dc \uc6c3\uc74c\uc774 \ub0ac\ub2e4.":"Watching Yujin mutter as if displeased, I can't help but smile.",
"\ub354 \ub9ce\uc774 \ud574\uc57c\uc9c0~ \uc774\uc81c\ubd80\ud130\ub294 \ub2e4\ub974\uac8c.":"Then we'll do even more~ Differently, from now on.",
"\uc5b4\ub5a4 \uc758\ubbf8\uc778\uc9c0 \uc54c\uc544\ucc28\ub9b0 \ub4ef \uc720\uc9c4\uc758 \uadd3\ubd88\uc774 \ubc1c\uac1b\uac8c \ubb3c\ub4e4\uc5c8\ub2e4.":"As if he's caught my meaning, Yujin's earlobes turn pink.",
"\uc774\ub0b4 \ub0b4 \uc5b4\uae68\uc5d0 \uac00\ub9cc\ud788 \uc774\ub9c8\ub97c \uae30\ub314\ub2e4.":"Then he quietly rests his forehead on my shoulder.",

"\ubb34\ub98e \uc0ac\uc774\uc5d0 \uc5bc\uad74\uc744 \ubb3b\uc790 \ucc38\uc544 \uc654\ub358 \ub208\ubb3c\uc774 \ub69d\ub69d \ub5a8\uc5b4\uc9c4\ub2e4. \uc18c\ub9e4 \ub05d\uc774 \uc810\uc810 \ucd95\ucd95\ud574\uc9c0\uace0, \ub0b4 \ub208\ubb3c\uc5d0 \uc720\uc9c4\uc758 \ub0c4\uc0c8\uac00 \uc11e\uc778\ub2e4.":"\u819d\u306e\u9593\u306b\u9854\u3092\u3046\u305a\u3081\u308b\u3068\u3001\u3053\u3089\u3048\u3066\u3044\u305f\u6d99\u304c\u307d\u305f\u307d\u305f\u3068\u843d\u3061\u308b\u3002\u8896\u306e\u5148\u304c\u3060\u3093\u3060\u3093\u6e7f\u3063\u3066\u3001\u50d5\u306e\u6d99\u306b\u30e6\u30b8\u30f3\u306e\u5302\u3044\u304c\u6df7\u3056\u308b\u3002",

"\ud604\uad00 \ube44\ubc00\ubc88\ud638 \uc18c\ub9ac. \uc608\uc815\ubcf4\ub2e4 \ud6e8\uc52c \uc77c\ucc0d \uc720\uc9c4\uc774\uac00 \uc219\uc18c\uc5d0 \uc654\ub2e4. \ud604\uad00\ubb38\uc774 \ub2eb\ud788\ub294 \uc18c\ub9ac\uac00 \ub4e4\ub9ac\uae30\ub3c4 \uc804\uc5d0, \ub2e4\uae09\ud55c \uc720\uc9c4\uc758 \ubc1c\uc18c\ub9ac\uac00 \ub4e4\ub9b0\ub2e4.":"\u7384\u95a2\u306e\u6697\u8a3c\u756a\u53f7\u306e\u97f3\u3002\u4e88\u5b9a\u3088\u308a\u305a\u3063\u3068\u65e9\u304f\u3001\u30e6\u30b8\u30f3\u304c\u5bbf\u820e\u306b\u5e30\u3063\u3066\u304d\u305f\u3002\u7384\u95a2\u306e\u30c9\u30a2\u304c\u9589\u307e\u308b\u97f3\u304c\u3059\u308b\u3088\u308a\u5148\u306b\u3001\u30e6\u30b8\u30f3\u306e\u6025\u3044\u3060\u8db3\u97f3\u304c\u805e\u3053\u3048\u308b\u3002",
"\ub178\ud06c\ub3c4 \uc5c6\uc774 \ubc29\ubb38\uc774 \uc5f4\ub9b0\ub2e4. \ubb38 \uc55e\uc5d0 \uc720\uc9c4\uc774 \uc11c \uc788\ub2e4. \uc190\uc5d0\ub294 \ud3b8\uc758\uc810 \ubd09\uc9c0\uac00 \ub4e4\ub824 \uc788\ub2e4. \uadf8 \uc548\uc5d0 \ub0b4\uac00 \uba39\uace0 \uc2f6\ub2e4\uace0 \ud588\ub358 \uc824\ub9ac\uac00 \ubcf4\uc778\ub2e4.":"\u30ce\u30c3\u30af\u3082\u306a\u3057\u306b\u90e8\u5c4b\u306e\u30c9\u30a2\u304c\u958b\u304f\u3002\u30c9\u30a2\u306e\u524d\u306b\u30e6\u30b8\u30f3\u304c\u7acb\u3063\u3066\u3044\u308b\u3002\u624b\u306b\u306f\u30b3\u30f3\u30d3\u30cb\u306e\u888b\u3002\u305d\u306e\u4e2d\u306b\u3001\u50d5\u304c\u98df\u3079\u305f\u3044\u3068\u8a00\u3063\u3066\u3044\u305f\u30b0\u30df\u304c\u898b\u3048\u308b\u3002",
"\uc720\uc9c4\uc774 \uc544\ubb34 \ub9d0 \uc5c6\uc774 \ud55c \uac78\uc74c \ub4e4\uc5b4\uc628\ub2e4. \ub098\ub294 \uc5bc\uad74\uc744 \ub3cc\ub838\uc9c0\ub9cc \uc774\ubbf8 \ub2a6\uc5c8\ub2e4.":"\u30e6\u30b8\u30f3\u304c\u4f55\u3082\u8a00\u308f\u305a\u306b\u4e00\u6b69\u5165\u3063\u3066\u304f\u308b\u3002\u50d5\u306f\u9854\u3092\u305d\u3080\u3051\u305f\u3051\u3069\u3001\u3082\u3046\u9045\u304b\u3063\u305f\u3002",
"\uc720\uc9c4\uc758 \uc2dc\uc120\uc774 \ub0b4\uac00 \uc785\uace0 \uc788\ub294 \uc790\uae30 \ud6c4\ub4dc\uc5d0 \uc7a0\uc2dc \uba38\ubb3c\ub2e4\uac00, \ub208\ubb3c\uc5d0 \uc816\uc740 \uc18c\ub9e4 \ub05d\uc73c\ub85c \ucc9c\ucc9c\ud788 \uc62e\uaca8 \uac04\ub2e4.":"\u30e6\u30b8\u30f3\u306e\u8996\u7dda\u304c\u3001\u50d5\u304c\u7740\u3066\u3044\u308b\u81ea\u5206\u306e\u30d1\u30fc\u30ab\u30fc\u306b\u5c11\u3057\u3068\u3069\u307e\u3063\u3066\u3001\u6d99\u3067\u6fe1\u308c\u305f\u8896\u306e\u5148\u3078\u3086\u3063\u304f\u308a\u79fb\u3063\u3066\u3044\u304f\u3002",
"\ubc97\uc744 \ud2c8\uc774 \uc5c6\uc5c8\ub2e4. \ubcc0\uba85\ud560 \ud2c8\ub3c4.":"\u8131\u3050\u3072\u307e\u3082\u306a\u304b\u3063\u305f\u3002\u8a00\u3044\u8a33\u3059\u308b\u3072\u307e\u3082\u3002",
"\u201c\ud615\uc774 \uc65c \ubbf8\uc548\ud574\uc694.\u201d \uc720\uc9c4\uc774 \uc18d\uc0c1\ud55c \uc5bc\uad74\ub85c \ubb3b\ub294\ub2e4":"\u300c\u306a\u3093\u3067\u30d2\u30e7\u30f3\u304c\u8b1d\u308b\u3093\u3067\u3059\u304b\u300d\u30e6\u30b8\u30f3\u304c\u3064\u3089\u305d\u3046\u306a\u9854\u3067\u805e\u304f",
"\ud615\uc774 \uc65c \ubbf8\uc548\ud574\uc694.":"\u306a\u3093\u3067\u30d2\u30e7\u30f3\u304c\u8b1d\u308b\u3093\u3067\u3059\u304b\u3002",
"\uc720\uc9c4\uc774 \uce68\ub300 \uc55e\uc5d0 \ubb34\ub98e\uc744 \uafc7\uace0 \uc549\uc544 \ub0b4 \uc5bc\uad74\uc744 \uc62c\ub824\ub2e4\ubcf8\ub2e4.":"\u30e6\u30b8\u30f3\u304c\u30d9\u30c3\u30c9\u306e\u524d\u306b\u3072\u3056\u307e\u305a\u3044\u3066\u3001\u50d5\u306e\u9854\u3092\u898b\u4e0a\u3052\u308b\u3002",
"\uadf8\ub807\uac8c \ub04a\uc5b4 \ubc84\ub9ac\uba74 \uc81c\uac00 \uc5b4\ub5bb\uac8c \uc78a\uc5b4\uc694.":"\u3042\u3093\u306a\u3075\u3046\u306b\u5207\u3089\u308c\u305f\u3089\u3001\u5fd8\u308c\u3089\u308c\u308b\u308f\u3051\u306a\u3044\u3058\u3083\u306a\u3044\u3067\u3059\u304b\u3002",
"\ub098\ub3c4 \ubaa8\ub974\uac8c \ub0b4\ubc49\uc740 \ub9d0\uc774\uc5c8\ub294\ub370, \uadf8 \ub9d0\uc744 \ubd99\uc7a1\uace0 \uc5ec\uae30\uae4c\uc9c0 \ub2ec\ub824\uc62c \uc904\uc740 \ubab0\ub790\ub2e4.":"\u601d\u308f\u305a\u3053\u307c\u3057\u305f\u8a00\u8449\u3060\u3063\u305f\u306e\u306b\u3001\u305d\u306e\u8a00\u8449\u3092\u3064\u304b\u3093\u3067\u3053\u3053\u307e\u3067\u99c6\u3051\u3064\u3051\u3066\u304f\u308b\u306a\u3093\u3066\u601d\u308f\u306a\u304b\u3063\u305f\u3002",
"\uc720\uc9c4\uc774 \ub9d0\uc5c6\uc774 \ub208\ubb3c\uc744 \ub2e6\uc544 \uc900\ub2e4":"\u30e6\u30b8\u30f3\u304c\u9ed9\u3063\u3066\u6d99\u3092\u306c\u3050\u3063\u3066\u304f\u308c\u308b",
"\uc720\uc9c4\uc774 \ub9d0\uc5c6\uc774 \uc190\uc744 \ubed7\uc5b4 \ub0b4 \ub208\uac00\uc758 \ub208\ubb3c\uc744 \ub2e6\uc544 \uc900\ub2e4.":"\u30e6\u30b8\u30f3\u304c\u9ed9\u3063\u3066\u624b\u3092\u4f38\u3070\u3057\u3001\u50d5\u306e\u76ee\u5143\u306e\u6d99\u3092\u306c\u3050\u3063\u3066\u304f\u308c\u308b\u3002",
"\uc190\ub05d\uc774 \ucc28\uac11\ub2e4. \ubc16\uc5d0\uc11c\ubd80\ud130 \ub6f0\uc5b4\uc628 \uc0ac\ub78c\uc758 \uc190\uc774\ub2e4.":"\u6307\u5148\u304c\u51b7\u305f\u3044\u3002\u5916\u304b\u3089\u8d70\u3063\u3066\u304d\u305f\u4eba\u306e\u624b\u3060\u3002",
"\ubc00\uc5b4\ub0b4\uc57c \ud558\ub294\ub370, \ub098\ub3c4 \ubaa8\ub974\uac8c \uadf8 \uc190\uc5d0 \uc5bc\uad74\uc744 \uae30\ub300\uace0 \ub9cc\ub2e4.":"\u62bc\u3057\u8fd4\u3055\u306a\u304d\u3083\u3044\u3051\u306a\u3044\u306e\u306b\u3001\u6c17\u3065\u3051\u3070\u305d\u306e\u624b\u306b\u9854\u3092\u9810\u3051\u3066\u3057\u307e\u3046\u3002",
"\u2026\uc6b8\uc9c0 \ub9c8\uc694, \ud615.":"\u2026\u6ce3\u304b\u306a\u3044\u3067\u304f\u3060\u3055\u3044\u3001\u30d2\u30e7\u30f3\u3002",
"\u201c\uc65c \ubc8c\uc368 \uc654\uc5b4..?\u201d \ud558\uc624\uac00 \ub208\ubb3c\uc744 \uac10\ucd94\uba70 \ubb3b\ub294\ub2e4":"\u300c\u306a\u3093\u3067\u3082\u3046\u5e30\u3063\u3066\u304d\u305f\u306e..\uff1f\u300d\u30cf\u30aa\u304c\u6d99\u3092\u96a0\u3057\u306a\u304c\u3089\u805e\u304f",
"\uc65c \ubc8c\uc368 \uc654\uc5b4..?":"\u306a\u3093\u3067\u3082\u3046\u5e30\u3063\u3066\u304d\u305f\u306e..\uff1f",
"\uc544\ub2c8\uc57c\u2026 \uadf8\ub0e5 \ub098 \uc548\uc544 \uc918..":"\u306a\u3093\u3067\u3082\u306a\u3044\u2026\u305f\u3060\u62b1\u304d\u3057\u3081\u3066..",
"\uc720\uc9c4\uc774 \ub300\ub2f5 \ub300\uc2e0 \ubd09\uc9c0\ub97c \ub0b4\ub824\ub193\uace0 \ub098\ub97c \ub04c\uc5b4\uc548\ub294\ub2e4.":"\u30e6\u30b8\u30f3\u304c\u7b54\u3048\u308b\u4ee3\u308f\u308a\u306b\u888b\u3092\u7f6e\u3044\u3066\u3001\u50d5\u3092\u62b1\u304d\u3057\u3081\u308b\u3002",
"\ub9de\ub2ff\uc740 \uac00\uc2b4 \ub108\uba38\ub85c \uc720\uc9c4\uc758 \uc2ec\uc7a5 \uc18c\ub9ac\uac00 \ub4e4\ub9b0\ub2e4. \ucff5, \ucff5, \ucff5. \uc228\uc774 \ucc30 \ub9cc\ud07c \ube60\ub974\ub2e4.":"\u91cd\u306a\u3063\u305f\u80f8\u306e\u5411\u3053\u3046\u304b\u3089\u3001\u30e6\u30b8\u30f3\u306e\u5fc3\u81d3\u306e\u97f3\u304c\u805e\u3053\u3048\u308b\u3002\u30c9\u30af\u30f3\u3001\u30c9\u30af\u30f3\u3001\u30c9\u30af\u30f3\u3002\u606f\u304c\u5207\u308c\u308b\u307b\u3069\u901f\u3044\u3002",
"\u2026\uc5ec\uae30\uae4c\uc9c0 \ub6f0\uc5b4\uc654\uad6c\ub098. \ub098 \ub54c\ubb38\uc5d0.":"\u2026\u3053\u3053\u307e\u3067\u8d70\u3063\u3066\u304d\u305f\u3093\u3060\u3002\u50d5\u306e\u305b\u3044\u3067\u3002",
"\uc81c\uac00 \ubbf8\uc548\ud574\uc694.":"\u50d5\u306e\u307b\u3046\u3053\u305d\u3001\u3059\u307f\u307e\u305b\u3093\u3002",
"\uc800\ub294 \uc790\uafb8 \ud615\ub9cc \uc2e0\uacbd \uc4f0\uc5ec\uc11c\u2026 \ud639\uc2dc \ud615\uc774 \uadf8\uac78 \ubd80\ub2f4\uc2a4\ub7ec\uc6cc\ud560\uae4c \ubd10, \uadf8\uac8c \ubb34\uc11c\uc6e0\uc5b4\uc694.":"\u50d5\u3001\u30d2\u30e7\u30f3\u306e\u3053\u3068\u3070\u304b\u308a\u6c17\u306b\u306a\u3063\u3066\u2026\u30d2\u30e7\u30f3\u304c\u305d\u308c\u3092\u91cd\u8377\u306b\u611f\u3058\u305f\u3089\u3069\u3046\u3057\u3088\u3046\u3063\u3066\u3001\u305d\u308c\u304c\u6016\u304b\u3063\u305f\u3093\u3067\u3059\u3002",
"\ub098\ub9cc \ubd88\uc548\ud55c \uc904 \uc54c\uc558\ub2e4. \uc720\uc9c4\uc774\ub3c4 \ub098\ub9cc\ud07c, \uc5b4\uca4c\uba74 \ub098\ubcf4\ub2e4 \ub354 \ud754\ub4e4\ub9ac\uace0 \uc788\uc5c8\ub2e4. \uc774\ubc88\uc5d4 \ub098\ub3c4 \ub9d0\ud574\uc57c \ud55c\ub2e4.":"\u4e0d\u5b89\u306a\u306e\u306f\u50d5\u3060\u3051\u3060\u3068\u601d\u3063\u3066\u3044\u305f\u3002\u30e6\u30b8\u30f3\u3082\u50d5\u3068\u540c\u3058\u304f\u3089\u3044\u3001\u3082\u3057\u304b\u3057\u305f\u3089\u50d5\u4ee5\u4e0a\u306b\u63fa\u308c\u3066\u3044\u305f\u3002\u4eca\u5ea6\u306f\u50d5\u3082\u8a00\u308f\u306a\u304d\u3083\u3002",
"\ubd80\ub2f4 \uc548 \uac00\uc838. \ub098\ub294\u2026 \uc720\uc9c4\uc774\uac00 \ub098\ub97c \ub354 \uc2e0\uacbd \uc368 \uc92c\uc73c\uba74 \uc88b\uaca0\uc5b4.":"\u91cd\u8377\u306a\u3093\u304b\u3058\u3083\u306a\u3044\u3002\u50d5\u306f\u2026\u30e6\u30b8\u30f3\u306b\u3082\u3063\u3068\u50d5\u306e\u3053\u3068\u6c17\u306b\u3057\u3066\u307b\u3057\u3044\u3002",

function draw(l){clearInterval(ty);ty=0;st.last=l;stopTyping();if(l[4]==='typing')setTimeout(typing,0);const w=l[0],nm=$('nm'),isT=w==='TH'||w==='TY';$('tap').classList.toggle('on',isT);if(isT){nm.style.display='none';$('box').className='tin done';full=l[1];st.lg.push(l);if(st.lg.length>120)st.lg.shift();stopVo();renderChat();if(sf&&!sk)tone(w==='TH'?880:740,.06,.03);fin();return}nm.textContent=nz(NM[w]||'');nm.style.display=w==='N'?'none':'';nm.className='n'+w;const b=$('box');b.className=(w==='M'?'mono':w==='N'?'nar':'sp')+' s'+w;b.innerHTML='<span id="tx"></span><small></small>';full=nz(l[1]);const tx=$('tx');tx.textContent=full;b.classList.add('done');st.lg.push(l);if(st.lg.length>120)st.lg.shift();if(l[3])playVo(l[3]);else{stopVo();if(sf&&!sk)tone(w==='M'?523:w==='Y'?660:w==='G'?587:440,.05,.03)}if(!ty)fin()}
function after(){const sc=S[st.id];if(st.q){st.q=null;return nxt()}if(sc.c)return choices(sc);nxt()}
function nxt(){const sc=S[st.id];if(sc.e)return ending(sc.e);let x=st.nx||sc.n;if(typeof x==='function')x=x(st.s);go(x)}
function choices(sc){stopVo();$('tap').classList.remove('on');au=0;sk=0;$('b3').classList.remove('on');$('b4').classList.remove('on');const c=$('ch');c.innerHTML='';sc.c.forEach(o=>{const b=document.createElement('button');const sp=o[0].split('|');if(sp.length>1){const t=document.createElement('span');t.className='who '+(sp[0]==='유진'?'wY':'wH');t.textContent=sp[0];b.append(t,document.createTextNode(nz(sp[1])))}else b.textContent=nz(o[0]);b.onclick=()=>{for(const k in o[1])st.s[k]+=o[1][k];st.lg.push(['H','▶ '+o[0].replace('|',' · ')]);st.q=o[2];st.i=0;st.nx=o[3]||sc.n;xf();c.classList.add('hide');$('box').classList.remove('hide');$('nm').classList.remove('hide');if(sf)tone(700,.1,.05);show()};c.append(b)});$('box').classList.add('hide');$('nm').classList.add('hide');c.classList.remove('hide')}
function ending(k){stopVo();setCg('');au=sk=0;const gg=ls.g('hj2_g')||[];if(!gg.includes(k)){gg.push(k);ls.s('hj2_g',gg)}const o=$('ov');o.classList.remove('hide');o.style.justifyContent='center';o.style.textAlign='center';o.innerHTML='<small style="color:var(--pk)">'+E[k][0]+'</small><h2>'+T(E[k][1])+'</h2><p>'+T(E[k][2])+'</p>';btn(o,'엔딩 갤러리',gal);btn(o,'처음부터',()=>askName());btn(o,'타이틀로',title)}
function askName(){au_();playBgm();const o=$('ov');o.classList.remove('hide');o.style.justifyContent='center';o.style.textAlign='center';o.innerHTML='<h2>'+T('그 사람의 이름은?')+'</h2><p>'+T('유진과 하오 사이에 나타나는 사람이에요.')+'<br>'+T('마음대로 지어도 돼요. (최대 5글자)')+'</p>';const mx=LG==='en'?10:5;const i=document.createElement('input');i.id='pn';i.maxLength=mx;i.placeholder=T('예) 김민준');i.autocomplete='off';o.append(i);const go1=()=>newGame(i.value.replace(/[<>&"'`\\\s]/g,'').slice(0,mx)||'민준');btn(o,'시작하기',go1);btn(o,'취소',title);i.onkeydown=e=>{if(e.key==='Enter')go1()};setTimeout(()=>i.focus(),50)}
function btn(p,t,f){const b=document.createElement('button');b.className='mb';b.textContent=T(t);b.onclick=f;p.append(b)}
function title(){stopVo();setCg('');$('game').classList.add('hide');$('ov').classList.add('hide');$('menu').classList.remove('hide');au=sk=0;clearTimeout(tm);clearInterval(ty);ty=0}
function gal(){const o=$('ov');o.classList.remove('hide');o.style.justifyContent='flex-start';o.style.textAlign='left';const gg=ls.g('hj2_g')||[];o.innerHTML='<h2>'+T('엔딩 갤러리')+' ('+gg.length+'/'+Object.keys(E).length+')</h2>';Object.keys(E).forEach(k=>{const d=document.createElement('div');d.className='gl';d.innerHTML=gg.includes(k)?'<small>'+E[k][0]+'</small><br><b>'+T(E[k][1])+'</b><br>'+T(E[k][2]):'<small>???</small><br>'+T('아직 보지 못한 엔딩');o.append(d)});btn(o,'닫기',()=>{o.classList.add('hide');if($('game').classList.contains('hide'))$('menu').classList.remove('hide')})}
function log(){const o=$('ov');o.classList.remove('hide');o.style.justifyContent='flex-start';o.style.textAlign='left';o.innerHTML='<h2>'+T('대화 로그')+'</h2>';st.lg.forEach(l=>{const d=document.createElement('div');d.className='lg';const b=document.createElement('b');b.textContent=nz(NM[l[0]]||'')+' ';d.append(b,nz(l[1]));o.append(d)});btn(o,'닫기',()=>o.classList.add('hide'))}
setInterval(()=>{const m=$('menu');if(m.classList.contains('hide'))return;const t=Math.floor((Date.now()-(window.cv0||(window.cv0=Date.now())))/1000);$('cvc').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000);
function devJump(){const o=$('ov');o.classList.remove('hide');o.style.justifyContent='flex-start';o.style.textAlign='left';o.innerHTML='<h2>장면 바로가기</h2><p style="margin-bottom:14px">수정 확인용이에요. 고른 장면부터 바로 시작해요. (선택지 점수는 0에서 시작)</p>';let eh=0;Object.keys(S).forEach(k=>{const sc=S[k];if(!sc.l||!sc.l.length&&!sc.c&&!sc.e)return;if(sc.e&&!eh){eh=1;const h=document.createElement('p');h.style.cssText='margin:16px 0 8px;color:var(--lamp);font-family:var(--pix);font-size:13px';h.textContent='엔딩';o.append(h)}const f=sc.l.find(x=>x[0]!=='CG'&&x[0]!=='RD');const b=document.createElement('button');b.className='dj';b.innerHTML='<b></b><span></span><small></small>';b.querySelector('b').textContent=k;b.querySelector('span').textContent=sc.t||'';b.querySelector('small').textContent=f?nz(f[1]):sc.e?E[sc.e][1]+' (대사 없이 바로 엔딩)':'';b.onclick=()=>{au_();playBgm();if(!st||$('game').classList.contains('hide')){hist=[];st={pn:'민준',id:k,i:0,s:{y:0,h:0,o:0,p:0},q:null,nx:null,lg:[],last:null}}stopVo();o.classList.add('hide');ui();go(k)};o.append(b)});btn(o,'닫기',()=>o.classList.add('hide'))}

$('bn').onclick=()=>askName();
function cont(d){if(!d)return;hist=(d.hs||[]).slice();st=d;ui();setCg(...cgNow());setBg(S[st.id].b);lastT=S[st.id].t||'';if(st.i>=cur().length)after();else{const L=cur();draw(L[st.i-1]||st.last);st.lg.pop()}}
$('bc').onclick=()=>{const d=ls.g('hj2_s');if(!d){toast('저장된 기록이 없어요');return}au_();playBgm();cont(d)};
function stopAuto(){au=sk=0;clearTimeout(tm);$('b3').classList.remove('on');$('b4').classList.remove('on')}
function back(){if(busy)return;const ch=!$('ch').classList.contains('hide');if(hist.length<(ch?1:2)){toast('이전 내용이 없어요');return}stopAuto();if(!ch)hist.pop();const d=JSON.parse(hist.pop());st.id=d.id;st.i=d.i;st.s=d.s;st.q=d.q;st.nx=d.nx;st.lg.length=Math.min(st.lg.length,d.n);setBg(S[d.id].b);$('ch').classList.add('hide');$('box').classList.remove('hide');$('nm').classList.remove('hide');$('ov').classList.add('hide');show()}
$('bk').onclick=back;
function resume(inGame){const o=$('ov');o.classList.remove('hide');o.style.justifyContent='center';o.style.textAlign='center';o.innerHTML='<h2>'+T('이어서 하시겠어요?')+'</h2><p>'+T('하던 곳부터 계속할 수 있어요.')+'</p>';btn(o,'이어서 하기',()=>{o.classList.add('hide');playBgm();if(!inGame){au_();cont(ls.g('hj2_s'))}});btn(o,'타이틀로',()=>{o.classList.add('hide');title()})}
document.addEventListener('visibilitychange',()=>{const live=st&&!$('game').classList.contains('hide');if(!live)return;if(document.hidden){ls.s('hj2_s',st);stopAuto();stopVo();bgm.pause();ring.pause()}else if($('ov').classList.contains('hide'))resume(true)});
$('bg2').onclick=gal;$('game').addEventListener('click',e=>{if(e.target===$('game')&&$('ch').classList.contains('hide')&&$('ov').classList.contains('hide'))$('box').onclick()});$('box').onclick=()=>{if(busy)return;if(ty){fin();return}clearTimeout(tm);show()};
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!$('game').classList.contains('hide')&&$('ch').classList.contains('hide')&&$('ov').classList.contains('hide')){e.preventDefault();$('box').onclick()}});
$('b1').onclick=log;$('b2').onclick=()=>{ls.s('hj2_s',st);toast('저장했어요')};
$('b3').onclick=e=>{au=!au;sk=0;e.target.classList.toggle('on',!!au);$('b4').classList.remove('on');au?show():clearTimeout(tm)};
$('b4').onclick=e=>{sk=!sk;au=0;e.target.classList.toggle('on',!!sk);$('b3').classList.remove('on');sk?show():clearTimeout(tm)};
$('b5').onclick=e=>{mb=!mb;e.target.classList.toggle('on',!!mb);playBgm()};$('b6').onclick=e=>{sf=!sf;if(!sf){stopVo();ring.pause()}e.target.classList.toggle('on',!!sf)};
$('b7').onclick=()=>{ls.s('hj2_s',st);title()};
function applyLang(){document.documentElement.lang=LG==='zh'?'zh-Hans':LG;document.title=T('사랑한다고 해 줘');document.querySelectorAll('[data-k]').forEach(e=>{e.textContent=T(e.dataset.k)})}
function setLang(l){LG=(TR[l]||l==='ko')?l:'ko';ls.s('hj2_lang',LG);applyLang()}
function langPick(first){const o=$('ov');o.classList.remove('hide');o.style.justifyContent='center';o.style.textAlign='center';o.innerHTML='<h2>언어 선택 · Language</h2><p>语言 · 言語</p>';[['ko','한국어'],['en','English'],['zh','中文 (简体)'],['ja','日本語']].forEach(([c,t])=>btn(o,t,()=>{setLang(c);o.classList.add('hide');if(first&&ls.g('hj2_s'))resume(false)}))}
$('blang').onclick=()=>langPick(false);
$('b3').classList.remove('on');$('b4').classList.remove('on');title();{const sl=ls.g('hj2_lang');if(!sl)langPick(true);else{setLang(sl);if(ls.g('hj2_s'))resume(false)}}
</script></body></html>
